<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Games Dashboard</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>Games Dashboard</h1>
        <p class="meta" id="meta">Loading…</p>
      </div>
      <div class="pickers">
        <label class="picker">
          <span>Game</span>
          <select id="game-select" aria-label="Choose a game"></select>
        </label>
        <label class="picker" id="date-picker" hidden>
          <span>Day</span>
          <select id="date-select" aria-label="Choose a day"></select>
        </label>
      </div>
    </header>

    <div class="banner" id="demo-banner" hidden>
      Demo data. The real numbers appear after the first daily run.
    </div>
    <div class="banner past" id="past-banner" hidden>
      <span>You're looking at <strong id="past-day"></strong>. Every number covers the days up to and including that day.</span>
      <button type="button" class="link" id="back-to-latest">Back to latest</button>
    </div>

    <div id="view"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
